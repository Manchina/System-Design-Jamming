name: system-design-jamming

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sdj-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: system_design
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d system_design"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-primary:
    image: redis:7-alpine
    container_name: sdj-redis-primary
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_primary_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-shard-1:
    image: redis:7-alpine
    container_name: sdj-redis-shard-1
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-shard-2:
    image: redis:7-alpine
    container_name: sdj-redis-shard-2
    restart: unless-stopped
    ports:
      - "6381:6379"
    command: redis-server --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-shard-3:
    image: redis:7-alpine
    container_name: sdj-redis-shard-3
    restart: unless-stopped
    ports:
      - "6382:6379"
    command: redis-server --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: alpine/minio:latest-release
    container_name: sdj-minio
    restart: unless-stopped
    user: root
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redis_primary_data:
  minio_data:
